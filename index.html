<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery & Receiving Reminder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .section-box {
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            color: #007BFF;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .days-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .day-btn {
            padding: 8px 4px;
            border: 1px solid #007BFF;
            background: #fff;
            color: #007BFF;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s;
        }
        .day-btn:hover, .day-btn.active {
            background: #007BFF;
            color: white;
        }
        .custom-date-container {
            margin-top: 8px;
        }
        .preview {
            background: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }
        .preview strong {
            color: #007BFF;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Delivery & Receiving Tracker</h2>
    
    <div class="form-group">
        <label for="nameInput">Item / Name:</label>
        <input type="text" id="nameInput" placeholder="e.g. Package, Document, Order" oninput="updatePreview()">
    </div>

    <!-- Receiving Section -->
    <div class="section-box">
        <div class="section-title">Receiving Date</div>
        <div class="days-buttons" id="receiving-btns">
            <button type="button" class="day-btn active" onclick="setPreset('receiving', 2, this)">2 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('receiving', 5, this)">5 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('receiving', 7, this)">7 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('receiving', 12, this)">12 Days</button>
        </div>
        <div class="custom-date-container">
            <label for="receivingCustom">Or pick custom date:</label>
            <input type="date" id="receivingCustom" onchange="setCustom('receiving')">
        </div>
    </div>

    <!-- Delivery Section -->
    <div class="section-box">
        <div class="section-title">Delivery Date</div>
        <div class="days-buttons" id="delivery-btns">
            <button type="button" class="day-btn active" onclick="setPreset('delivery', 3, this)">3 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('delivery', 7, this)">7 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('delivery', 10, this)">10 Days</button>
            <button type="button" class="day-btn" onclick="setPreset('delivery', 14, this)">14 Days</button>
        </div>
        <div class="custom-date-container">
            <label for="deliveryCustom">Or pick custom date:</label>
            <input type="date" id="deliveryCustom" onchange="setCustom('delivery')">
        </div>
    </div>

    <div class="preview" id="previewBox">
        <!-- Live preview generated here -->
    </div>

    <button class="submit-btn" onclick="addToCalendar()">Add to Calendar</button>
</div>

<script>
    // State storage for dates
    let receivingDate = new Date();
    receivingDate.setDate(receivingDate.getDate() + 2);

    let deliveryDate = new Date();
    deliveryDate.setDate(deliveryDate.getDate() + 3);

    function setPreset(type, days, btn) {
        // Clear custom input field visually when preset is clicked
        document.getElementById(type + 'Custom').value = '';

        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + days);

        if (type === 'receiving') {
            receivingDate = targetDate;
        } else {
            deliveryDate = targetDate;
        }

        // Update active button styles for that group
        const container = document.getElementById(type + '-btns');
        container.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        updatePreview();
    }

    function setCustom(type) {
        const customVal = document.getElementById(type + 'Custom').value;
        if (!customVal) return;

        // Parse date string (YYYY-MM-DD) correctly in local time
        const parts = customVal.split('-');
        const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);

        if (type === 'receiving') {
            receivingDate = targetDate;
        } else {
            deliveryDate = targetDate;
        }

        // Remove active state from preset buttons since custom is used
        const container = document.getElementById(type + '-btns');
        container.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));

        updatePreview();
    }

    function formatDateDisplay(date) {
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        return date.toLocaleDateString(undefined, options);
    }

    function updatePreview() {
        const name = document.getElementById('nameInput').value.trim() || '...';
        
        document.getElementById('previewBox').innerHTML = `
            <strong>Receiving of ${name}:</strong> ${formatDateDisplay(receivingDate)}<br>
            <strong>Delivery of ${name}:</strong> ${formatDateDisplay(deliveryDate)}
        `;
    }

    function formatDateICS(date) {
        return date.toISOString().replace(/-|:|\.\d+/g, '');
    }

    function addToCalendar() {
        const name = document.getElementById('nameInput').value.trim() || 'Item';
        
        // Setup start times (9:00 AM)
        let recStart = new Date(receivingDate);
        recStart.setHours(9, 0, 0, 0);
        let recEnd = new Date(recStart);
        recEnd.setMinutes(recEnd.getMinutes() + 30);

        let delStart = new Date(deliveryDate);
        delStart.setHours(10, 0, 0, 0);
        let delEnd = new Date(delStart);
        delEnd.setMinutes(delEnd.getMinutes() + 30);

        // Generate iCalendar (.ics) format string containing both events
        const icsContent = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'BEGIN:VEVENT',
            `SUMMARY:Receiving of ${name}`,
            `DTSTART:${formatDateICS(recStart)}`,
            `DTEND:${formatDateICS(recEnd)}`,
            `DESCRIPTION:Scheduled receiving date for ${name}`,
            'END:VEVENT',
            'BEGIN:VEVENT',
            `SUMMARY:Delivery of ${name}`,
            `DTSTART:${formatDateICS(delStart)}`,
            `DTEND:${formatDateICS(delEnd)}`,
            `DESCRIPTION:Scheduled delivery date for ${name}`,
            'END:VEVENT',
            'END:VCALENDAR'
        ].join('\n');

        // Create download blob
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `schedule_${name.replace(/\s+/g, '_')}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Initial load preview
    updatePreview();
</script>

</body>
</html>
